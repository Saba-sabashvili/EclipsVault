name: Release

# Build, push, and cryptographically sign a production image on a version tag (e.g. v1.0.0).
#
# Signing is KEYLESS (Sigstore): this workflow's GitHub OIDC identity signs the image, and the
# signature is recorded in the public Rekor transparency log. There is no private key to hold,
# rotate, or leak — a customer verifies the image against *this workflow's identity*, so a
# signature can only have been produced by this repository's release pipeline.
#
# Customers verify with the commands in docs/VERIFYING.md.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read # checkout
  packages: write # push the image (and its signature) to GHCR
  id-token: write # OIDC token cosign exchanges for a short-lived signing certificate

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR image names must be lowercase; the repository owner has capitals, so normalise once.
      - name: Resolve lowercase image name
        run: echo "IMAGE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Sign by DIGEST (immutable), never by tag (a tag can later be repointed). One signature on
      # the manifest digest covers every tag that resolves to it. cosign uses the ambient OIDC
      # token automatically because id-token:write is granted above — no key material involved.
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE}@${DIGEST}"

      # A CycloneDX SBOM for exactly this release, attached to the image as a *signed* attestation,
      # so a consumer can fetch and trust the bill of materials for the image they are about to run.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate SBOM
        run: |
          dotnet tool install --global CycloneDX
          dotnet restore --locked-mode
          dotnet CycloneDX EclipsVault.Web/EclipsVault.Web.csproj -o sbom -fn sbom.json -F Json

      - name: Attest the SBOM to the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate sbom/sbom.json "${REGISTRY}/${IMAGE}@${DIGEST}"
