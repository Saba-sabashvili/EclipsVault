name: Release

# Build, push, and cryptographically sign a production image on a version tag (e.g. v1.0.0).
#
# Signing is KEYLESS (Sigstore): this workflow's GitHub OIDC identity signs the image, and the
# signature is recorded in the public Rekor transparency log. There is no private key to hold,
# rotate, or leak — a customer verifies the image against *this workflow's identity*, so a
# signature can only have been produced by this repository's release pipeline.
#
# Customers verify with the commands in docs/VERIFYING.md.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read # checkout; the release job adds what pushing and signing need

env:
  REGISTRY: ghcr.io

# Actions use full commit SHAs; Buildx uses a fixed version and BuildKit a digest, because these
# tools run in the job that can push and sign. CI rehearses the same versions without publishing.
jobs:
  # The SBOM is written here, apart from the release job, because its generators are third-party
  # code: this job holds no registry credentials and no OIDC identity, so a compromised tool can
  # neither push nor sign anything. The tools are locked too (see the script). Step for step this is
  # CI's sbom job, which runs on every change.
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: EclipsVault.AngularUi/.nvmrc

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Generate SBOM
        run: bash .github/sbom/sbom.sh

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/sbom.json
          if-no-files-found: error

  release:
    needs: sbom
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # push the image (and its signature) to GHCR
      id-token: write # OIDC token cosign exchanges for a short-lived signing certificate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The sbom job's output, fetched before anything is pushed so a failed hand-off publishes
      # nothing, and kept outside the workspace so it never enters the image's build context. The
      # download fails if the file's digest doesn't match what that job uploaded.
      - name: Download the SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom
          digest-mismatch: error

      # GHCR image names must be lowercase; the repository owner has capitals, so normalise once.
      - name: Resolve lowercase image name
        run: echo "IMAGE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0
          # Executables in this job must not come from a cache another job can populate.
          cache-binary: false
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Sign by DIGEST (immutable), never by tag (a tag can later be repointed). One signature on
      # the manifest digest covers every tag that resolves to it. cosign uses the ambient OIDC
      # token automatically because id-token:write is granted above — no key material involved.
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE}@${DIGEST}"

      # A CycloneDX SBOM for exactly this release, attached to the image as a *signed* attestation,
      # so a consumer can fetch and trust the bill of materials for the image they are about to run.
      # The sbom job wrote it from this same commit.
      - name: Attest the SBOM to the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate "${RUNNER_TEMP}/sbom/sbom.json" "${REGISTRY}/${IMAGE}@${DIGEST}"
