name: CI

on:
  # Every branch, not just main. Work here lands on stacked feature branches that may sit for a
  # while before they are merged or ever see a pull request — CI that only watches main is CI that
  # tells you a week late.
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Locked-mode restore fails if packages.lock.json is out of date — guarantees the
      # committed lockfile matches Directory.Packages.props (reproducible builds).
      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  # The vault targets two database engines, so every model change needs a migration in BOTH sets.
  # One that reaches only one engine leaves the schemas silently different, and nothing notices
  # until a deployment on the other engine hits a column that was never created. Neither check
  # needs a database — they compare the model to the committed snapshot.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Install EF tools
        run: dotnet tool install --global dotnet-ef

      - name: SQL Server migrations match the model
        run: dotnet ef migrations has-pending-model-changes -p EclipsVault.Infrastructure -s EclipsVault.Web -c EclipsVaultDbContext

      - name: PostgreSQL migrations match the model
        env:
          ECLIPSVAULT_DESIGN_PROVIDER: Postgres
        run: dotnet ef migrations has-pending-model-changes -p EclipsVault.Migrations.Postgres -s EclipsVault.Web -c EclipsVaultDbContext

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # appsettings.Development.json holds the dev KEK fallback and the seed passwords. It is
      # git-ignored, but an ignore rule is a convention and this is a vault — make it a gate.
      - name: Dev settings are not committed
        run: |
          if git ls-files --error-unmatch EclipsVault.Web/appsettings.Development.json > /dev/null 2>&1; then
            echo "::error::appsettings.Development.json is tracked — it carries the dev KEK and seed passwords"
            exit 1
          fi
          echo "OK — appsettings.Development.json is not tracked"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # Fail the job if any referenced package has a known vulnerability.
      - name: Audit dependencies
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then
            echo "::error::Vulnerable packages detected"
            exit 1
          fi

  # The release workflow builds this Dockerfile, but it only ever runs on a v* tag — so before this
  # job existed, the first execution of the production image build was also its first test, on the
  # tag that was supposed to be the release. A Dockerfile break would surface as a failed release
  # rather than a failed PR, and recovering means deleting and re-pushing a tag that may already be
  # public. Build it here on every push so a tag only ever publishes something already proven to
  # build.
  #
  # Build only: no push, no registry credentials, no cosign. Signing needs the tag's OIDC identity
  # and a real digest in GHCR, so it stays in release.yml — this job de-risks the step that has no
  # such requirement. Kept deliberately identical to release.yml's build (same context, same action)
  # so it is a rehearsal and not merely a similar-looking build.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # GitHub's action cache keeps the restore/publish layers warm across runs; without it
          # every PR pays a full NuGet restore and publish.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install CycloneDX
        run: dotnet tool install --global CycloneDX

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      # A software bill of materials for the deployed app: every transitive dependency, so a
      # consumer can audit what ships. Fits the pin-and-prove supply-chain posture.
      - name: Generate SBOM
        run: dotnet CycloneDX EclipsVault.Web/EclipsVault.Web.csproj -o sbom -fn sbom.json -F Json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/sbom.json
