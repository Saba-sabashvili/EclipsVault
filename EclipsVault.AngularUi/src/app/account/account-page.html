<main>
  <h1>Signed in</h1>
  @if (me.hasValue()) {
    <dl>
      <dt>Display name</dt>
      <dd>{{ me.value().displayName }}</dd>
      <dt>Username</dt>
      <dd>{{ me.value().username }}</dd>
      <dt>Clearance</dt>
      <dd>{{ me.value().clearance }}</dd>
      <dt>Project</dt>
      <dd>{{ me.value().project }}</dd>
    </dl>
    <button type="button" (click)="me.reload()">Refresh</button>
  } @else if (me.error()) {
    <p role="alert">Could not load your account.</p>
  } @else {
    <p>Loading…</p>
  }
</main>
