<header class="page-header">
  <h1>Signed in</h1>
</header>
<section class="panel" aria-label="Signed-in account">
  @if (me.hasValue()) {
    <dl class="detail-grid">
      <dt>Display name</dt>
      <dd>{{ me.value().displayName }}</dd>
      <dt>Username</dt>
      <dd>{{ me.value().username }}</dd>
      <dt>Clearance</dt>
      <dd>{{ me.value().clearance }}</dd>
      <dt>Project</dt>
      <dd>{{ me.value().project }}</dd>
    </dl>
    <button type="button" class="button" (click)="me.reload()">Refresh</button>
  } @else if (me.error()) {
    <p role="alert">Could not load your account.</p>
  } @else {
    <p>Loading…</p>
  }
</section>
